aid: voya
name: Voya
description: Voya GmbH is a software development and consulting company based in Hamburg,
  Germany, with nearshore TechHubs in Bucharest and Cluj, Romania. Founded in 2015
  as an AI-powered chat-based business-travel booking platform backed by 500 Global,
  it became a wholly-owned Volkswagen Group subsidiary and has been an independent,
  founder-led company again since November 2024. Today Voya delivers end-to-end software
  development, applied AI solutions, and engineering team building for automotive,
  mobility, and travel clients including Volkswagen, Audi, CARIAD, Deutsche Bahn,
  and Lufthansa City Center. TISAX certified. Voya publishes no public API or developer
  portal.
